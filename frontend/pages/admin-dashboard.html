<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel RH - Tecnosonda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark"><img src="/assets/logo-tecnosonda-symbol.png" alt="Logo Tecnosonda"></div>
        <div class="sidebar-brand-text">
          TECNOSONDA
          <small>Painel RH</small>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-title">Menu</div>
        <a href="/admin/dashboard" class="sidebar-link active">
          <span class="sidebar-link-icon">📋</span>
          Admissões
        </a>
        <a href="/admin/talentos" class="sidebar-link">
          <span class="sidebar-link-icon">🎯</span>
          Banco de Talentos
        </a>
        <a href="/" class="sidebar-link">
          <span class="sidebar-link-icon">🏠</span>
          Página inicial
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="userAvatar">??</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="userName">-</div>
            <div class="sidebar-user-email" id="userEmail">-</div>
          </div>
          <button class="btn-icon btn-ghost" id="btnLogout" title="Sair">
            ⏻
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header-title">
          <h1>Admissões em andamento</h1>
          <p>Gerencie todos os processos admissionais</p>
        </div>
        <button class="btn btn-primary" id="btnNewEmployee">
          <span>+</span> Novo Colaborador
        </button>
      </header>

      <div class="main-content">
        <div class="stats-grid" id="statsGrid">
          <!-- preenchido dinamicamente -->
        </div>

        <div class="filters-bar">
          <div class="search-input">
            <input type="text" id="searchInput" placeholder="Buscar por nome, CPF, contrato..." />
          </div>
          <select class="form-select" id="statusFilter" style="width:auto; max-width:240px;">
            <option value="">Todos os status</option>
            <option value="aguardando_documentacao">Aguardando documentação</option>
            <option value="documentacao_recebida">Documentação recebida</option>
            <option value="reaberto_para_correcao">Reaberto para correção</option>
          </select>
          <button class="btn btn-secondary" id="btnRefresh">Atualizar</button>
        </div>

        <div class="data-table">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Colaborador</th>
                  <th>Contrato</th>
                  <th>Responsável</th>
                  <th>Token</th>
                  <th>Status</th>
                  <th>Cadastrado em</th>
                  <th style="text-align:right;">Ações</th>
                </tr>
              </thead>
              <tbody id="employeesTbody">
                <tr><td colspan="7" style="padding:40px; text-align:center; color:var(--gray-600);">Carregando...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
